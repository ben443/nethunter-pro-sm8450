## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Masked
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Key: MOBIAN_CACHE_HOST
#   - Value: <ansible_host>

## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Masked and hidden
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Description: $ ansible localhost -m debug -a 'msg={{ kali_build_ssh_key_private.splitlines() }}' | awk '/msg/ {p=1; next} /]/ {p=0} p {gsub(/^[ \t"]+|[",]+$/, ""); print}' | base64 -w0
#   - Key: MOBIAN_CI_SSH_KEY
#   - Value: <kali_build_ssh_key_private | base64 -w0; echo>

## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Masked
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Key: MOBIAN_IMAGES_HOST
#   - Value: <ansible_host>

## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Masked
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Key: SSH_USER
#   - Value: <kali_nethunterpro_user>

## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Visible
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Key: ARTIFACTS_ROOT
#   - Value: /srv/artifacts/gitlab-ci/nethunterpro/artifacts

## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Visible
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Key: IMAGES_CI_ROOT
#   - Value: /srv/artifacts/gitlab-ci/nethunterpro/ci-images

## Settings -> CI/CD -> Variables -> Expand -> Add variable
#   - Type: Variable
#   - Environments: All (default)
#   - Visibility: Visible
#   - Flags
#       Protect variable: Enabled
#       Expand variable reference: Disabled
#   - Key: IMAGES_ROOT
#   - Value: /srv/artifacts/gitlab-ci/nethunterpro/images

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

## Can't use GitLab SaaS artifacts, as the files are larger than that max size (1GB+): 2024-08-18

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'       # Manual trigger from UI
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'  # Manual trigger via API
    - if: '$CI_SERVER_URL == "https://gitlab.com" && $CI_PROJECT_ROOT_NAMESPACE == "kalilinux"'   # $CI_PROJECT_NAMESPACE == "kalilinux/nethunter/build-scripts", $CI_PROJECT_PATH == "kalilinux/nethunter/build-scripts//kali-nethunter-pro"
      when: always
    - when: never                              # Disable all automatic triggers

include:
  - .gitlab-ci/job-definitions.yml
  - .gitlab-ci/global-declarations.yml
  - .gitlab-ci/devices.yml

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
