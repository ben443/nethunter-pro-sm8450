{{- $architecture := or .architecture "arm64" -}}
{{- $device := or .device "r8q" }}

architecture: {{ $architecture }}

actions:
  - action: overlay
    description: Losetup root img file from storage
    source: initramfs-tools
    destination: /usr/share/initramfs-tools

  - action: run
    chroot: true
    description: Drop systemd-repart configuration
    command: rm -rf /etc/repart.d/

  - action: apt
    recommends: false
    description: Install device-specific base packages
    packages:
      - gstreamer1.0-plugins-base-apps
      - yq
{{- if ne $device "wip" }}
{{- if or (eq $device "sm8450") (eq $device "gts8wifi") (eq $device "r8q") }}
      - qcom-support-common
{{- if eq $device "r8q" }}
      - firmware-qcom-soc
{{- end }}
{{- if or (eq $device "sm8450") (eq $device "gts8wifi") }}
      - make
      - gcc
      - binutils
      - gcc-aarch64-linux-gnu
      - binutils-aarch64-linux-gnu
      - libc6-dev
      - file
      - bison
      - flex
      - gzip
      - wget
      - xz-utils
      - zstd
{{- end }}
{{- else }}
      - {{ $device }}-support
{{- end }}
{{- else }}
      - qcom-support-common
      - openssh-server

  - action: overlay
    description: Copy additional packages to image
{{- if eq $device "r8q" }}
    source: packages/r8q
{{- else }}
    source: packages
{{- end }}
    destination: /srv

{{- if eq $device "r8q" }}
  - action: overlay
    description: Add r8q DTB to image
    source: overlays/r8q
    destination: /
{{- end }}

  - action: run
    chroot: true
    description: Install additional packages
    command: dpkg -i /srv/*.deb

{{- if eq $device "r8q" }}
  - action: run
    chroot: true
    description: Regenerate initramfs for the installed r8q kernel
    command: >-
      backup="$(mktemp)";
      had_resume=0;
      if [ -f /etc/initramfs-tools/conf.d/resume ]; then
        cp /etc/initramfs-tools/conf.d/resume "${backup}";
        had_resume=1;
      fi;
      echo "RESUME=none" > /etc/initramfs-tools/conf.d/resume;
      update-initramfs -u;
      if [ "${had_resume}" -eq 1 ]; then
        mv "${backup}" /etc/initramfs-tools/conf.d/resume;
      else
        rm -f /etc/initramfs-tools/conf.d/resume "${backup}";
      fi
{{- end }}

  - action: overlay
    description: Add droid-juicer configuration to image
    source: droid-juicer
    destination: /usr/share/droid-juicer/configs
{{- end }}

{{- if or (eq $device "sm8450") (eq $device "gts8wifi") }}
  - action: run
    chroot: true
    description: Build and install uniLoader from source
    script: install-uniloader-sm8450.sh
{{- end }}

  - action: run
    description: Enable essential qcom services
    chroot: true
    command: systemctl enable qrtr-ns.service rmtfs.service pd-mapper.service tqftpserv.service droid-juicer.service qcom-modem-setup.service
