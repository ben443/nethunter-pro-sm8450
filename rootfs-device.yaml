{{- $architecture := or .architecture "arm64" -}}
{{- $family := or .family "sunxi" }}
{{- $nonfree := or .nonfree "false" -}}
{{- $device := or .device "pinephone" }}
{{- $environment := or .environment "phosh" -}}
{{- $rootfs := or .rootfs "rootfs.tar.xz" }}
{{- $miniramfs := or .miniramfs "false" }}

architecture: {{ $architecture }}

actions:
  - action: unpack
    file: {{ $rootfs }}

{{ if eq $nonfree "true" }}
  - action: run
    description: Enable non-free-firmware repos
    chroot: true
    script: scripts/setup-apt-nonfree.sh true
{{ end }}

  - action: recipe
    recipe: include/packages-fde.yaml

  - action: recipe
    recipe: devices/{{ $family }}/packages-base.yaml
    variables:
      device: {{ $device }}

  - action: recipe
    recipe: devices/{{ $family }}/packages-{{ $environment }}.yaml
    variables:
      device: {{ $device }}

{{ if eq $device "r8q" }}
  - action: overlay
    description: Copy local r8q kernel packages
    source: packages/r8q
    destination: /tmp/r8q-debs

  - action: run
    description: Install firmware and custom r8q kernel
    chroot: true
    command: apt-get update && apt-get install -y firmware-qcom-soc && dpkg -i /tmp/r8q-debs/*.deb && rm -rf /tmp/r8q-debs
{{ end }}

{{ if eq $miniramfs "true" }}
  - action: apt
    recommends: true
    description: install miniramfs
    packages:
      - miniramfs
{{ end }}

  - action: run
    description: Cleanup filesystem
    chroot: true
    script: scripts/rootfs-cleanup.sh

  - action: pack
    file: rootfs-{{ $device }}-{{ $environment }}.tar.xz
    comp
    ression: xz
